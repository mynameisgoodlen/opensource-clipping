name: AI Stream Clipper - Facecam + Gameplay

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste your YouTube video or completed livestream URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  clip:
    name: Find 2 highlights and render split-screen clips
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure YouTube player client fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("clipping/engine.py")
          source = path.read_text(encoding="utf-8")

          old = '            "extractor_args": {"youtube": ["player_client=android,web"]},\n'

          new = (
              '            "extractor_args": {"youtube": ["player_client=default,-web_embedded"]},\n'
              '            "force_ipv4": True,\n'
          )

          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
              print("Updated YouTube player client settings.")
          elif new in source:
              print("YouTube fallback settings are already installed.")
          else:
              raise SystemExit(
                  "ERROR: Could not find the expected YouTube settings in clipping/engine.py"
              )
          PY

          python -m py_compile clipping/engine.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libsm6 libxext6
          ffmpeg -version
          deno --version

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir \
            "numpy==1.26.4" \
            "mediapipe==0.10.21" \
            "opencv-python==4.11.0.86" \
            Pillow requests python-dotenv faster-whisper google-genai tqdm

      - name: Update yt-dlp
        run: |
          python -m pip install --no-cache-dir --upgrade --pre "yt-dlp[default]"
          yt-dlp --version

      - name: Prepare secrets and YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_API_KEY:-}" ]]; then
            echo "::error::Missing GEMINI_API_KEY repository secret. Add it once in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "::add-mask::$GOOGLE_API_KEY"
          if [[ -z "${YOUTUBE_COOKIES:-}" ]]; then
            echo "::error::Missing YOUTUBE_COOKIES repository secret. Add the full Netscape-format cookies.txt contents."
            exit 1
          fi
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube_cookies.txt"
          chmod 600 "$RUNNER_TEMP/youtube_cookies.txt"

      - name: Download, find 2 highlights and render base clips
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${VIDEO_URL//[[:space:]]/}" ]]; then
            echo "::error::YouTube URL is missing."
            exit 1
          fi
          mkdir -p outputs
          python main.py \
            --url "$VIDEO_URL" \
            --source youtube \
            --yt-cookies "$RUNNER_TEMP/youtube_cookies.txt" \
            --clips 2 \
            --ratio "3:4" \
            --source-height max \
            --render-height 1080 \
            --ai-provider gemini \
            --whisper-model base \
            --whisper-device cpu \
            --whisper-compute-type int8 \
            --face-detector mediapipe \
            --no-subs \
            --no-broll \
            --no-bgm \
            --no-hook \
            --no-segment-trim \
            --video-crf 17 \
            --video-preset slow \
            --video-scale-algo lanczos

      - name: Download only selected 4K facecam segments (when available)
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python tools/download_facecam_4k_segments.py \
            --url "$VIDEO_URL" \
            --manifest outputs/render_manifest.json \
            --source video_asli.mp4 \
            --cookies "$RUNNER_TEMP/youtube_cookies.txt" \
            --output-dir "$RUNNER_TEMP/facecam_4k_segments"

      - name: Render facecam on top and gameplay below (1080x1440)
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s video_asli.mp4
          test -s outputs/render_manifest.json
          python tools/streamer_gameplay_split.py \
            --source video_asli.mp4 \
            --manifest outputs/render_manifest.json \
            --width 1080 \
            --height 1440 \
            --sample-interval 0.75 \
            --facecam-sharpen 0.15 \
            --facecam-trim-left 0.02 \
            --facecam-trim-top 0.12 \
            --facecam-trim-right 0.02 \
            --facecam-trim-bottom 0.10 \
            --crf 17 \
            --preset slow

      - name: Check generated clips
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          count=$(find outputs -type f -name 'highlight_rank_*_ready.mp4' | wc -l)
          echo "Generated final clips: $count"
          if [[ "$count" -lt 1 ]]; then
            echo "::error::No final MP4 clips were generated."
            find outputs -maxdepth 4 -type f -print || true
            exit 1
          fi
          find outputs -type f -name 'highlight_rank_*_ready.mp4' -exec ls -lh {} \;

      - name: Upload final clips
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: facecam-gameplay-clips-1080x1440
          path: outputs/**/highlight_rank_*_ready.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove temporary cookies
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/youtube_cookies.txt"

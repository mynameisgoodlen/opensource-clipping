name: AI Stream Clipper - Long Stream Safe + Real-ESRGAN Facecam + Gameplay

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste your YouTube video or completed livestream URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  clip:
    name: Find 2 highlights and render 1080x1440 facecam/gameplay clips
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg and system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libsm6 libxext6
          ffmpeg -version
          ffprobe -version
          deno --version

      - name: Install base Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir \
            "numpy==1.26.4" \
            "mediapipe==0.10.21" \
            "opencv-contrib-python==4.11.0.86" \
            Pillow requests python-dotenv faster-whisper google-genai tqdm

      - name: Update yt-dlp
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --upgrade --pre "yt-dlp[default]"
          yt-dlp --version

      - name: Configure YouTube player client for main and 4K downloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          engine_path = Path("clipping/engine.py")
          engine = engine_path.read_text(encoding="utf-8")
          old_engine = '            "extractor_args": {"youtube": ["player_client=android,web"]},\n'
          new_engine = (
              '            "extractor_args": {"youtube": ["player_client=default,-web_embedded"]},\n'
              '            "force_ipv4": True,\n'
          )

          if old_engine in engine:
              engine = engine.replace(old_engine, new_engine, 1)
              engine_path.write_text(engine, encoding="utf-8")
              print("Configured the main YouTube downloader.")
          elif '"player_client=default,-web_embedded"' in engine and '"force_ipv4": True' in engine:
              print("Main YouTube downloader is already configured.")
          else:
              raise SystemExit("Could not safely find the expected YouTube settings in clipping/engine.py")

          facecam_path = Path("tools/download_facecam_4k_segments.py")
          facecam = facecam_path.read_text(encoding="utf-8")
          old_facecam = '            "--remote-components", "ejs:github",\n'
          new_facecam = (
              old_facecam
              + '            "--extractor-args", "youtube:player_client=default,-web_embedded",\n'
              + '            "--force-ipv4",\n'
          )

          if old_facecam in facecam and '"--extractor-args", "youtube:player_client=default,-web_embedded"' not in facecam:
              facecam = facecam.replace(old_facecam, new_facecam, 1)
              facecam_path.write_text(facecam, encoding="utf-8")
              print("Configured the 4K facecam segment downloader.")
          elif '"--extractor-args", "youtube:player_client=default,-web_embedded"' in facecam:
              print("4K facecam downloader is already configured.")
          else:
              raise SystemExit("Could not safely configure tools/download_facecam_4k_segments.py")
          PY
          python -m py_compile clipping/engine.py tools/download_facecam_4k_segments.py

      - name: Validate Gemini secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_API_KEY:-}" ]]; then
            echo "::error::Missing GEMINI_API_KEY repository secret."
            exit 1
          fi
          echo "::add-mask::$GOOGLE_API_KEY"

      - name: Prepare and validate YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ.get("YOUTUBE_COOKIES", "")
          if not raw.strip():
              raise SystemExit(
                  "Missing YOUTUBE_COOKIES repository secret. Add your signed-in YouTube cookies.txt "
                  "in Netscape format to GitHub Actions secrets."
              )

          cookie_path = Path(os.environ["RUNNER_TEMP"]) / "youtube_cookies.txt"
          cookie_path.write_text(raw.rstrip() + "\n", encoding="utf-8")
          cookie_path.chmod(0o600)

          youtube_rows = [
              line for line in raw.splitlines()
              if len(line.split("\t")) >= 7 and "youtube.com" in line.split("\t", 1)[0].lower()
          ]
          if not youtube_rows:
              cookie_path.unlink(missing_ok=True)
              raise SystemExit(
                  "YOUTUBE_COOKIES is not a Netscape cookies.txt file or contains no youtube.com entries. "
                  "Export cookies while signed in to YouTube."
              )

          print(f"Validated Netscape cookies file ({len(youtube_rows)} YouTube cookie entries).")
          PY

      - name: Download capped 360p analysis source, find 2 highlights and render base clips
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${VIDEO_URL//[[:space:]]/}" ]]; then
            echo "::error::YouTube URL is missing."
            exit 1
          fi

          test -s "$RUNNER_TEMP/youtube_cookies.txt"
          echo "Runner disk before analysis-source download:"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          mkdir -p outputs

          python main.py \
            --url "$VIDEO_URL" \
            --source youtube \
            --yt-cookies "$RUNNER_TEMP/youtube_cookies.txt" \
            --clips 2 \
            --ratio "3:4" \
            --source-height 360 \
            --render-height 1080 \
            --ai-provider gemini \
            --whisper-model base \
            --whisper-device cpu \
            --whisper-compute-type int8 \
            --face-detector mediapipe \
            --no-subs \
            --use-dlp-subs \
            --no-karaoke \
            --no-broll \
            --no-bgm \
            --no-hook \
            --no-segment-trim \
            --video-crf 17 \
            --video-preset medium \
            --video-scale-algo lanczos

          test -s video_asli.mp4
          test -s outputs/render_manifest.json

      - name: Download only selected clips at best available quality (1080p/4K)
        timeout-minutes: 30
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tools "$RUNNER_TEMP/selected_video_segments"
          cat > tools/download_selected_video_segments.py <<'PY'
          #!/usr/bin/env python3
          """Download only selected YouTube highlight sections at the best available quality.
          
          The full stream is used only for analysis at a small capped resolution. These
          short sections become the final rendering sources for BOTH the gameplay and
          facecam panels, preserving native 1080p/4K quality without storing a 23-hour
          high-bitrate file on the GitHub runner.
          """
          from __future__ import annotations
          
          import argparse
          import glob
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path
          from typing import Any
          
          
          def log(message: str) -> None:
              print(message, flush=True)
          
          
          def manifest_clips(data: Any) -> tuple[list[dict[str, Any]], str | None]:
              if isinstance(data, list):
                  return data, None
              if isinstance(data, dict):
                  for key in ("results", "clips", "manifest"):
                      value = data.get(key)
                      if isinstance(value, list):
                          return value, key
              raise RuntimeError("Unsupported render manifest structure.")
          
          
          def probe_video(path: Path) -> tuple[int, int, float]:
              result = subprocess.run(
                  [
                      "ffprobe", "-v", "error", "-select_streams", "v:0",
                      "-show_entries", "stream=width,height:format=duration",
                      "-of", "json", str(path),
                  ],
                  check=True, capture_output=True, text=True,
              )
              info = json.loads(result.stdout)
              streams = info.get("streams") or []
              if not streams:
                  raise RuntimeError(f"No video stream found in {path}")
              width = int(streams[0].get("width", 0))
              height = int(streams[0].get("height", 0))
              duration = float((info.get("format") or {}).get("duration", 0) or 0)
              return width, height, duration
          
          
          def safe_rank(value: Any, fallback: int) -> str:
              return re.sub(r"[^A-Za-z0-9_-]+", "_", str(value or fallback)).strip("_") or str(fallback)
          
          
          def download_selected_segments(
              url: str,
              manifest_path: Path,
              cookies_path: Path,
              output_dir: Path,
          ) -> int:
              if not manifest_path.is_file():
                  raise RuntimeError(f"Render manifest does not exist: {manifest_path}")
              if not cookies_path.is_file():
                  raise RuntimeError(f"YouTube cookies file does not exist: {cookies_path}")
          
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              clips, nested_key = manifest_clips(manifest)
              output_dir.mkdir(parents=True, exist_ok=True)
              successes = 0
          
              for index, clip in enumerate(clips, 1):
                  if not isinstance(clip, dict):
                      continue
                  try:
                      start = float(clip.get("start_time", 0))
                      end = float(clip.get("end_time", 0))
                  except (TypeError, ValueError):
                      continue
                  if end <= start:
                      log(f"[{index}] Invalid highlight timestamps; leaving the low-res fallback.")
                      continue
          
                  rank = safe_rank(clip.get("rank"), index)
                  section_start = max(0.0, start - 1.5)
                  section_end = end + 1.5
                  local_clip_start = start - section_start
                  template = output_dir / f"selected_rank_{rank}.%(ext)s"
          
                  for stale in output_dir.glob(f"selected_rank_{rank}.*"):
                      if stale.is_file():
                          stale.unlink(missing_ok=True)
          
                  command = [
                      sys.executable, "-m", "yt_dlp",
                      "--cookies", str(cookies_path),
                      "--remote-components", "ejs:github",
                      "--extractor-args", "youtube:player_client=default,-web_embedded",
                      "--force-ipv4",
                      "--no-warnings",
                      "--no-progress",
                      "--download-sections", f"*{section_start:.3f}-{section_end:.3f}",
                      "--force-keyframes-at-cuts",
                      "--format", "bestvideo[vcodec!*=av01]+bestaudio/best[vcodec!*=av01]",
                      "--merge-output-format", "mp4",
                      "--output", str(template),
                      url,
                  ]
                  log(
                      f"[{index}/{len(clips)}] Downloading only highlight rank {rank}: "
                      f"{section_start:.2f}s–{section_end:.2f}s at best available source quality."
                  )
                  result = subprocess.run(command, check=False)
                  candidates = [
                      Path(name) for name in glob.glob(str(output_dir / f"selected_rank_{rank}.*"))
                      if not name.endswith((".part", ".ytdl"))
                  ]
                  chosen: Path | None = None
                  if result.returncode == 0:
                      for candidate in candidates:
                          try:
                              width, height, duration = probe_video(candidate)
                              required_duration = max(2.0, (end - start) * 0.70)
                              if width >= 640 and height >= 360 and duration >= required_duration:
                                  chosen = candidate.resolve()
                                  break
                          except Exception:
                              continue
          
                  if chosen is None:
                      log(
                          f"  WARNING: Best-quality section download failed for rank {rank}; "
                          "renderer will fall back to the capped 360p analysis source."
                      )
                      for candidate in candidates:
                          candidate.unlink(missing_ok=True)
                      continue
          
                  width, height, duration = probe_video(chosen)
                  clip["source_video_path"] = str(chosen)
                  clip["source_clip_start"] = round(local_clip_start, 3)
                  # The same high-quality segment is used for facecam and gameplay.
                  clip["facecam_source_path"] = str(chosen)
                  clip["facecam_source_start"] = round(local_clip_start, 3)
                  clip["source_segment_width"] = width
                  clip["source_segment_height"] = height
                  clip["source_segment_duration"] = round(duration, 3)
                  successes += 1
                  log(f"  Using {chosen.name}: {width}x{height}, {duration:.2f}s.")
          
              if nested_key is None:
                  output_manifest = clips
              else:
                  manifest[nested_key] = clips
                  output_manifest = manifest
              manifest_path.write_text(
                  json.dumps(output_manifest, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              log(f"High-quality selected segments ready: {successes}/{len(clips)}.")
              return successes
          
          
          def main() -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--url", required=True)
              parser.add_argument("--manifest", type=Path, required=True)
              parser.add_argument("--cookies", type=Path, required=True)
              parser.add_argument("--output-dir", type=Path, required=True)
              args = parser.parse_args()
              download_selected_segments(
                  args.url, args.manifest.resolve(), args.cookies.resolve(), args.output_dir.resolve()
              )
              return 0
          
          
          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except Exception as exc:
                  log(f"ERROR: {exc}")
                  raise SystemExit(1)
          PY
          python -m py_compile tools/download_selected_video_segments.py
          python tools/download_selected_video_segments.py \
            --url "$VIDEO_URL" \
            --manifest outputs/render_manifest.json \
            --cookies "$RUNNER_TEMP/youtube_cookies.txt" \
            --output-dir "$RUNNER_TEMP/selected_video_segments"
          echo "Disk usage after short-segment downloads:"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true

      - name: Check selected facecam resolutions
        id: facecam_source_check
        shell: bash
        run: |
          set -euo pipefail
          NEEDS_SR=$(python - <<'PY'
          import json
          from pathlib import Path
          import sys
          import cv2

          manifest_path = Path("outputs/render_manifest.json")
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          if isinstance(data, dict):
              clips = data.get("results") or data.get("clips") or data.get("manifest") or []
          else:
              clips = data

          root = manifest_path.parent.parent
          needs_sr = False
          for item in clips:
              value = item.get("facecam_source_path")
              candidate = Path(str(value)) if value else Path("video_asli.mp4")
              if not candidate.is_absolute():
                  candidate = (root / candidate).resolve()
              if not candidate.is_file():
                  candidate = (root / "video_asli.mp4").resolve()
              cap = cv2.VideoCapture(str(candidate))
              height = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT)) if cap.isOpened() else 0
              cap.release()
              print(f"Selected facecam source: {candidate} ({height}p)", file=sys.stderr)
              if 0 < height < 2160:
                  needs_sr = True
          print("true" if needs_sr else "false")
          PY
          )
          echo "needs_sr=$NEEDS_SR" >> "$GITHUB_OUTPUT"
          echo "Real-ESRGAN required: $NEEDS_SR"

      - name: Install Real-ESRGAN x4plus and GFPGAN v1.4
        if: steps.facecam_source_check.outputs.needs_sr == 'true'
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1" "torchvision==0.20.1"
          python -m pip install --no-cache-dir \
            "basicsr==1.4.2" "facexlib==0.3.0" "gfpgan==1.3.8" "realesrgan==0.3.0"

          # Keep one compatible OpenCV wheel with the contrib DNN superres/flow modules.
          python -m pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          python -m pip install --no-cache-dir \
            "numpy==1.26.4" "opencv-contrib-python==4.11.0.86"

          mkdir -p weights tools
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth" \
            --output weights/RealESRGAN_x4plus.pth
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth" \
            --output weights/GFPGANv1.4.pth

          test "$(stat -c%s weights/RealESRGAN_x4plus.pth)" -gt 10000000
          test "$(stat -c%s weights/GFPGANv1.4.pth)" -gt 10000000

      - name: Create temporal Real-ESRGAN helper
        if: steps.facecam_source_check.outputs.needs_sr == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools weights
          cat > tools/facecam_quality_enhancer.py <<'PY'
          from __future__ import annotations

          import os
          import sys
          import time
          from pathlib import Path

          import cv2
          import numpy as np
          import torch

          # BasicSR 1.4.2 imports this symbol, removed in newer torchvision releases.
          import torchvision.transforms.functional as tv_functional
          sys.modules.setdefault("torchvision.transforms.functional_tensor", tv_functional)

          from basicsr.archs.rrdbnet_arch import RRDBNet
          from gfpgan import GFPGANer
          from realesrgan import RealESRGANer


          class TemporalRealESRGAN:
              """Real-ESRGAN/GFPGAN keyframe restoration with optical-flow propagation.

              Full neural inference is not run on every 60-FPS frame. A restored keyframe
              is generated every 0.75 seconds. Its high-frequency detail residual is
              warped onto intervening frames using dense optical flow, while each frame
              retains its own current image/content.
              """

              def __init__(self, weights_dir: Path = Path("weights"), interval_seconds: float = 0.75, tile: int = 512) -> None:
                  self.weights_dir = Path(weights_dir)
                  self.interval_seconds = max(0.25, float(interval_seconds))
                  self.tile = max(256, int(tile))

                  threads = max(1, min(2, os.cpu_count() or 2))
                  torch.set_num_threads(threads)
                  try:
                      torch.set_num_interop_threads(1)
                  except RuntimeError:
                      pass

                  self.device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
                  half = self.device.type == "cuda"
                  esr_path = self.weights_dir / "RealESRGAN_x4plus.pth"
                  gfp_path = self.weights_dir / "GFPGANv1.4.pth"
                  if not esr_path.is_file() or esr_path.stat().st_size < 10_000_000:
                      raise FileNotFoundError(f"Real-ESRGAN weights are missing/incomplete: {esr_path}")
                  if not gfp_path.is_file() or gfp_path.stat().st_size < 10_000_000:
                      raise FileNotFoundError(f"GFPGAN weights are missing/incomplete: {gfp_path}")

                  net = RRDBNet(num_in_ch=3, num_out_ch=3, num_feat=64, num_block=23, num_grow_ch=32, scale=4)
                  # The measured webcam crop was ~379x218; tile=512 makes it one ESRGAN tile,
                  # instead of the four 192px tiles used in the cancelled run.
                  self.upsampler = RealESRGANer(
                      scale=4, model_path=str(esr_path), model=net,
                      tile=self.tile, tile_pad=16, pre_pad=0, half=half, device=self.device,
                  )
                  self.face_restorer = GFPGANer(
                      model_path=str(gfp_path), upscale=4, arch="clean", channel_multiplier=2,
                      bg_upsampler=self.upsampler, device=self.device,
                  )
                  self.fps = 60.0
                  self.interval_frames = max(1, round(self.fps * self.interval_seconds))
                  self.frame_index = 0
                  self.keyframe_count = 0
                  self.previous_gray: np.ndarray | None = None
                  self.detail_residual: np.ndarray | None = None
                  self.output_size: tuple[int, int] | None = None
                  print(
                      "Temporal restoration ready: RealESRGAN_x4plus + GFPGAN v1.4; "
                      f"device={self.device}; tile={self.tile}; interval={self.interval_seconds:.2f}s.",
                      flush=True,
                  )

              def reset(self, fps: float) -> None:
                  self.fps = float(fps) if fps and fps > 0 else 30.0
                  self.interval_frames = max(1, int(round(self.fps * self.interval_seconds)))
                  self.frame_index = 0
                  self.keyframe_count = 0
                  self.previous_gray = None
                  self.detail_residual = None
                  self.output_size = None
                  print(
                      f"  Real-ESRGAN keyframe cadence: every {self.interval_frames} frames "
                      f"({self.interval_seconds:.2f}s at {self.fps:.2f} FPS).",
                      flush=True,
                  )

              def _restore_keyframe(self, crop: np.ndarray, output_size: tuple[int, int]) -> np.ndarray:
                  started = time.perf_counter()
                  restored = None
                  try:
                      _crops, _faces, restored = self.face_restorer.enhance(
                          crop, has_aligned=False, only_center_face=True, paste_back=True, weight=0.65
                      )
                  except Exception as exc:
                      print(
                          "  WARNING: GFPGAN failed on this keyframe; trying Real-ESRGAN x4 alone: "
                          f"{exc}", flush=True,
                      )
                  if restored is None or not restored.size:
                      restored, _ = self.upsampler.enhance(crop, outscale=4)
                  if restored is None or not restored.size:
                      raise RuntimeError("Real-ESRGAN returned an empty restored facecam frame.")
                  result = cv2.resize(restored, output_size, interpolation=cv2.INTER_AREA)
                  elapsed = time.perf_counter() - started
                  self.keyframe_count += 1
                  if self.keyframe_count <= 3 or self.keyframe_count % 10 == 0:
                      print(
                          f"  Real-ESRGAN keyframe {self.keyframe_count}: {elapsed:.1f}s; "
                          f"crop={crop.shape[1]}x{crop.shape[0]}.", flush=True,
                      )
                  return result

              def _warp_detail(self, current_gray: np.ndarray, output_size: tuple[int, int]) -> np.ndarray | None:
                  if self.previous_gray is None or self.detail_residual is None:
                      return None
                  if current_gray.shape != self.previous_gray.shape:
                      return None
                  try:
                      # Current -> previous flow is the inverse map needed by remap().
                      flow = cv2.calcOpticalFlowFarneback(
                          current_gray, self.previous_gray, None,
                          0.5, 3, 15, 3, 5, 1.2, 0,
                      )
                      out_w, out_h = output_size
                      src_h, src_w = current_gray.shape[:2]
                      flow_big = cv2.resize(flow, (out_w, out_h), interpolation=cv2.INTER_LINEAR)
                      flow_big[:, :, 0] *= out_w / max(1, src_w)
                      flow_big[:, :, 1] *= out_h / max(1, src_h)
                      grid_x, grid_y = np.meshgrid(
                          np.arange(out_w, dtype=np.float32),
                          np.arange(out_h, dtype=np.float32),
                      )
                      return cv2.remap(
                          self.detail_residual,
                          grid_x + flow_big[:, :, 0],
                          grid_y + flow_big[:, :, 1],
                          interpolation=cv2.INTER_LINEAR,
                          borderMode=cv2.BORDER_CONSTANT,
                          borderValue=0,
                      )
                  except Exception as exc:
                      print(f"  WARNING: optical-flow detail propagation failed: {exc}", flush=True)
                      return None

              def process(self, crop: np.ndarray, output_size: tuple[int, int]) -> np.ndarray:
                  if crop is None or crop.size == 0:
                      raise ValueError("Facecam crop is empty.")
                  output_size = (int(output_size[0]), int(output_size[1]))
                  base = cv2.resize(crop, output_size, interpolation=cv2.INTER_LANCZOS4)
                  gray = cv2.cvtColor(crop, cv2.COLOR_BGR2GRAY)
                  changed = self.output_size not in (None, output_size)
                  crop_changed = self.previous_gray is not None and self.previous_gray.shape != gray.shape
                  keyframe = (
                      self.detail_residual is None or changed or crop_changed
                      or self.frame_index % self.interval_frames == 0
                  )
                  warped = self._warp_detail(gray, output_size) if self.detail_residual is not None else None

                  if keyframe:
                      restored = self._restore_keyframe(crop, output_size)
                      new_detail = restored.astype(np.float32) - base.astype(np.float32)
                      self.detail_residual = (0.20 * warped + 0.80 * new_detail) if warped is not None else new_detail
                  elif warped is not None:
                      self.detail_residual = warped * 0.995
                  else:
                      self.detail_residual = np.zeros_like(base, dtype=np.float32)

                  self.previous_gray = gray
                  self.output_size = output_size
                  self.frame_index += 1
                  return np.clip(base.astype(np.float32) + self.detail_residual, 0, 255).astype(np.uint8)
          PY
          python -m py_compile tools/facecam_quality_enhancer.py
          PYTHONPATH=tools python - <<'PY'
          from facecam_quality_enhancer import TemporalRealESRGAN
          print("Real-ESRGAN/GFPGAN helper imports successfully.")
          PY

      - name: Patch renderer for temporal Real-ESRGAN keyframes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/patch_temporal_realesrgan.py" <<'PY'
          from pathlib import Path

          path = Path("tools/streamer_gameplay_split.py")
          source = path.read_text(encoding="utf-8")


          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Cannot patch {label}: expected exactly one match, found {count}.")
              source = source.replace(old, new, 1)


          replace_once(
              "from mediapipe.tasks.python import vision as mp_vision\n",
              "from mediapipe.tasks.python import vision as mp_vision\n"
              "try:\n"
              "    from facecam_quality_enhancer import TemporalRealESRGAN\n"
              "except Exception:\n"
              "    TemporalRealESRGAN = None\n",
              "optional Real-ESRGAN import",
          )

          replace_once(
              "    facecam_trim_bottom: float,\n"
              ") -> float:\n"
              '    """Render high-resolution facecam above gameplay from the base source."""\n',
              "    facecam_trim_bottom: float,\n"
              "    enhancer=None,\n"
              ") -> float:\n"
              '    """Render high-resolution facecam above gameplay from the base source."""\n',
              "renderer signature",
          )

          replace_once(
              '    log(\n'
              '        f"  Facecam frame (HQ): {face_rect_hq}; inner crop: {face_rect_hq_trimmed}; "\n'
              '        f"gameplay crop: {game_rect}"\n'
              '    )\n\n'
              '    panel_h = height_out // 2\n',
              '    log(\n'
              '        f"  Facecam frame (HQ): {face_rect_hq}; inner crop: {face_rect_hq_trimmed}; "\n'
              '        f"gameplay crop: {game_rect}"\n'
              '    )\n'
              '    if face_h >= 2160:\n'
              '        log("  Facecam quality path: genuine 4K+ source; restoration skipped.")\n'
              '    elif enhancer is not None:\n'
              '        enhancer.reset(fps)\n'
              '        log("  Facecam quality path: Real-ESRGAN x4 + GFPGAN v1.4 keyframes; optical-flow detail between keyframes.")\n'
              '    else:\n'
              '        log("  WARNING: Real-ESRGAN helper is unavailable; using Lanczos only.")\n\n'
              '    panel_h = height_out // 2\n',
              "quality path log",
          )

          replace_once(
              '            top = cv2.resize(top, (width_out, panel_h), interpolation=cv2.INTER_LANCZOS4)\n',
              '            if enhancer is not None and face_h < 2160:\n'
              '                top = enhancer.process(top, (width_out, panel_h))\n'
              '            else:\n'
              '                top = cv2.resize(top, (width_out, panel_h), interpolation=cv2.INTER_LANCZOS4)\n',
              "per-frame Real-ESRGAN call",
          )

          replace_once(
              "    clips = load_manifest(manifest_path)\n"
              "    detector = create_detector(args.model)\n"
              "    success = 0\n",
              "    clips = load_manifest(manifest_path)\n"
              "    detector = create_detector(args.model)\n"
              "    enhancer = None\n"
              "    needs_restoration = False\n"
              "    manifest_root = manifest_path.parent.parent\n"
              "    for item in clips:\n"
              "        value = item.get('facecam_source_path')\n"
              "        candidate = resolve_video_path(str(value), manifest_root) if value else facecam_source\n"
              "        if not candidate.is_file():\n"
              "            candidate = facecam_source\n"
              "        probe = cv2.VideoCapture(str(candidate))\n"
              "        candidate_height = int(probe.get(cv2.CAP_PROP_FRAME_HEIGHT)) if probe.isOpened() else 0\n"
              "        probe.release()\n"
              "        if candidate_height and candidate_height < 2160:\n"
              "            needs_restoration = True\n"
              "            break\n"
              "    if needs_restoration:\n"
              "        if TemporalRealESRGAN is None:\n"
              "            raise RuntimeError('Facecam is below 4K but Real-ESRGAN packages/helper were not installed.')\n"
              "        enhancer = TemporalRealESRGAN(weights_dir=Path('weights'), interval_seconds=0.75, tile=512)\n"
              "    else:\n"
              "        log('All selected facecam sources are genuine 4K+; skipping Real-ESRGAN initialization.')\n"
              "    success = 0\n",
              "initialize temporal Real-ESRGAN once",
          )

          replace_once(
              "                args.facecam_trim_right, args.facecam_trim_bottom,\n"
              "            )\n",
              "                args.facecam_trim_right, args.facecam_trim_bottom, enhancer,\n"
              "            )\n",
              "pass enhancer to renderer",
          )

          path.write_text(source, encoding="utf-8")
          print("Installed temporal Real-ESRGAN renderer patch.")
          PY
          python "$RUNNER_TEMP/patch_temporal_realesrgan.py"
          python -m py_compile tools/streamer_gameplay_split.py

      - name: Use selected high-quality segments for both gameplay and facecam
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/patch_long_stream_renderer.py" <<'PY'
          from pathlib import Path
          
          path = Path("tools/streamer_gameplay_split.py")
          source = path.read_text(encoding="utf-8")
          
          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Cannot patch {label}: expected exactly one match, found {count}.")
              source = source.replace(old, new, 1)
          
          old = '''            clip_face_source = facecam_source
                      clip_face_start = start
                      if clip.get("facecam_source_path"):
                          clip_face_source = Path(str(clip["facecam_source_path"]))
                          if not clip_face_source.is_absolute():
                              clip_face_source = (manifest_path.parent.parent / clip_face_source).resolve()
                          clip_face_start = float(clip.get("facecam_source_start", 0.0))
                          if not clip_face_source.is_file():
                              log(f"  WARNING: HQ facecam segment missing: {clip_face_source}; using base source.")
                              clip_face_source = facecam_source
                              clip_face_start = start
                      render_visual(
                          source, clip_face_source, clip_face_start, silent, start, end, args.width, args.height, detector,
                          args.sample_interval, args.crf, args.preset, args.facecam_sharpen,
                          args.facecam_corner, args.facecam_trim_left, args.facecam_trim_top,
                          args.facecam_trim_right, args.facecam_trim_bottom, enhancer,
                      )
                      mux_original_audio(source, silent, muxed, start, end - start)
          '''
          new = '''            # For long streams, the manifest can point to a short best-quality
                      # segment downloaded after AI analysis. Use that segment for BOTH
                      # gameplay and facecam, with its local timestamp offset. The capped
                      # full-stream source remains the safe fallback only.
                      clip_source = source
                      render_start = start
                      if clip.get("source_video_path"):
                          candidate_source = resolve_video_path(
                              str(clip["source_video_path"]), manifest_path.parent.parent
                          )
                          if candidate_source.is_file():
                              clip_source = candidate_source
                              render_start = float(clip.get("source_clip_start", 0.0))
                              log(
                                  f"  Using selected high-quality source: {clip_source.name} "
                                  f"({render_start:.2f}s local start)."
                              )
                          else:
                              log(
                                  f"  WARNING: selected source segment missing: {candidate_source}; "
                                  "using capped full-stream fallback."
                              )
                      render_end = render_start + (end - start)
          
                      clip_face_source = clip_source if clip.get("source_video_path") else facecam_source
                      clip_face_start = render_start if clip.get("source_video_path") else start
                      if clip.get("facecam_source_path"):
                          candidate_face = resolve_video_path(
                              str(clip["facecam_source_path"]), manifest_path.parent.parent
                          )
                          if candidate_face.is_file():
                              clip_face_source = candidate_face
                              clip_face_start = float(clip.get("facecam_source_start", render_start))
                          else:
                              log(
                                  f"  WARNING: HQ facecam source missing: {candidate_face}; "
                                  "using selected source video instead."
                              )
                              clip_face_source = clip_source
                              clip_face_start = render_start
          
                      render_visual(
                          clip_source, clip_face_source, clip_face_start, silent,
                          render_start, render_end, args.width, args.height, detector,
                          args.sample_interval, args.crf, args.preset, args.facecam_sharpen,
                          args.facecam_corner, args.facecam_trim_left, args.facecam_trim_top,
                          args.facecam_trim_right, args.facecam_trim_bottom, enhancer,
                      )
                      mux_original_audio(clip_source, silent, muxed, render_start, end - start)
          '''
          replace_once(old, new, "per-highlight selected video segment source")
          path.write_text(source, encoding="utf-8")
          print("Patched renderer for per-highlight high-quality source segments.")
          PY
          python "$RUNNER_TEMP/patch_long_stream_renderer.py"
          python -m py_compile tools/streamer_gameplay_split.py

      - name: Render facecam on top and gameplay below (1080x1440)
        timeout-minutes: 150
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s video_asli.mp4
          test -s outputs/render_manifest.json

          python tools/streamer_gameplay_split.py \
            --source video_asli.mp4 \
            --manifest outputs/render_manifest.json \
            --width 1080 \
            --height 1440 \
            --sample-interval 0.75 \
            --facecam-sharpen 0.15 \
            --facecam-trim-left 0.02 \
            --facecam-trim-top 0.12 \
            --facecam-trim-right 0.02 \
            --facecam-trim-bottom 0.10 \
            --crf 15 \
            --preset medium

      - name: Check generated clips
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          count=$(find outputs -type f -name 'highlight_rank_*_ready.mp4' | wc -l)
          echo "Generated final facecam/gameplay clips: $count"
          if [[ "$count" -lt 1 ]]; then
            echo "::error::No final MP4 clips were generated."
            find outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          find outputs -type f -name 'highlight_rank_*_ready.mp4' -exec ls -lh {} \;

      - name: Upload final clips
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: facecam-gameplay-clips-1080x1440
          path: outputs/**/highlight_rank_*_ready.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove temporary YouTube cookies
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/youtube_cookies.txt"


name: AI Stream Clipper

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste your YouTube video or stream URL"
        required: true
        type: string

      gemini_api_key:
        description: "Paste your Gemini API key"
        required: true
        type: string

permissions:
  contents: read

jobs:
  clip:
    name: Find and render 2 clips
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6

          ffmpeg -version
          deno --version

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip setuptools wheel

          python -m pip install --no-cache-dir \
            "numpy==1.26.4" \
            "mediapipe==0.10.21" \
            "opencv-python==4.11.0.86" \
            Pillow \
            requests \
            python-dotenv \
            faster-whisper \
            google-genai \
            tqdm \
            "yt-dlp[default]"

      - name: Update yt-dlp
        run: |
          python -m pip install --no-cache-dir --upgrade "yt-dlp[default]"
          yt-dlp --version

      - name: Prepare YouTube authentication
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail

          if [[ -z "${YOUTUBE_COOKIES:-}" ]]; then
            echo "::error::Missing YOUTUBE_COOKIES repository secret."
            echo "Add your Netscape-format cookies.txt contents as a repository secret."
            exit 1
          fi

          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube_cookies.txt"
          chmod 600 "$RUNNER_TEMP/youtube_cookies.txt"

      - name: Run AI clipping
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          GOOGLE_API_KEY: ${{ inputs.gemini_api_key }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${VIDEO_URL//[[:space:]]/}" ]]; then
            echo "::error::YouTube URL is missing."
            exit 1
          fi

          if [[ -z "${GOOGLE_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::Gemini API key is missing."
            exit 1
          fi

          echo "::add-mask::$GOOGLE_API_KEY"

          mkdir -p outputs

          python main.py \
            --url "$VIDEO_URL" \
            --source youtube \
            --yt-cookies "$RUNNER_TEMP/youtube_cookies.txt" \
            --clips 2 \
            --ratio "3:4" \
            --source-height max \
            --render-height 1080 \
            --ai-provider gemini \
            --whisper-model base \
            --whisper-device cpu \
            --whisper-compute-type int8 \
            --face-detector mediapipe \
            --use-dlp-subs \
            --no-subs \
            --no-broll \
            --no-bgm \
            --no-hook \
            --cleanup-source \
            --video-crf 17 \
            --video-preset slow \
            --video-scale-algo lanczos

      - name: Check generated clips
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p outputs

          count=$(find outputs -type f -name 'highlight_rank_*_ready.mp4' | wc -l)

          echo "Generated clips: $count"

          if [[ "$count" -eq 0 ]]; then
            echo "::error::No final MP4 clips were generated."
            find outputs -maxdepth 4 -type f -print || true
            exit 1
          fi

          find outputs -type f -name 'highlight_rank_*_ready.mp4' -exec ls -lh {} \;

      - name: Upload final clips
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: final-video-clips
          path: outputs/**/highlight_rank_*_ready.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Remove temporary cookies
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/youtube_cookies.txt"

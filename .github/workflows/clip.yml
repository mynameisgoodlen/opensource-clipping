
name: AI Stream Clipper

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste the YouTube video or stream URL"
        required: true
        type: string

      gemini_api_key:
        description: "Paste your Gemini API key"
        required: true
        type: string

permissions:
  contents: read

jobs:
  clip:
    name: Find and render 2 clips
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Update yt-dlp and EJS support
        run: |
          python -m pip install --no-cache-dir --upgrade "yt-dlp[default]"
          deno --version
          yt-dlp --version
      - name: Install FFmpeg and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip setuptools wheel

          python -m pip install --no-cache-dir \
            "numpy==1.26.4" \
            "mediapipe==0.10.21" \
            "opencv-python==4.11.0.86" \
            yt-dlp \
            faster-whisper \
            google-genai \
            Pillow \
            requests \
            python-dotenv

      - name: Run AI clipping
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          GOOGLE_API_KEY: ${{ inputs.gemini_api_key }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${VIDEO_URL//[[:space:]]/}" ]]; then
            echo "ERROR: YouTube URL is missing."
            exit 1
          fi

          if [[ -z "${GOOGLE_API_KEY//[[:space:]]/}" ]]; then
            echo "ERROR: Gemini API key is missing."
            exit 1
          fi

          # Hide the API key from subsequent log output.
          echo "::add-mask::$GOOGLE_API_KEY"

          if [[ "$VIDEO_URL" != https://* && "$VIDEO_URL" != http://* ]]; then
            echo "ERROR: Please enter a full YouTube URL."
            exit 1
          fi

          mkdir -p outputs

          python main.py \
            --url "$VIDEO_URL" \
            --source youtube \
            --clips 2 \
            --ratio "3:4" \
            --source-height max \
            --render-height 1080 \
            --ai-provider gemini \
            --gemini-model "gemini-3.8-flash" \
            --gemini-fallback-model "gemini-3.7-flash" \
            --whisper-model base \
            --whisper-device cpu \
            --whisper-compute-type int8 \
            --face-detector mediapipe \
            --use-dlp-subs \
            --no-subs \
            --no-broll \
            --no-bgm \
            --no-hook \
            --cleanup-source \
            --video-crf 17 \
            --video-preset slow \
            --video-scale-algo lanczos

      - name: Check generated clips
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          clips=(outputs/highlight_rank_*_ready.mp4)
          count=${#clips[@]}

          echo "Rendered clips: $count"

          if (( count == 0 )); then
            echo "ERROR: No final MP4 clips were generated."
            echo "Files found in outputs:"
            find outputs -maxdepth 2 -type f -print || true
            exit 1
          fi

          if (( count != 2 )); then
            echo "::warning::Expected 2 clips, but found $count."
          fi

          for clip in "${clips[@]}"; do
            ls -lh "$clip"
          done

      - name: Upload final MP4 clips
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: final-video-clips
          path: outputs/highlight_rank_*_ready.mp4
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
